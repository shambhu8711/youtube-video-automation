name: Free Hugging Face Cinematic Test
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/hf-cinematic-test.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_SPACE: zerogpu-aoti/wan2-2-fp8da-aoti-faster
      HF_API_NAME: /generate_video
      HF_MAX_SHOTS: "1"
      HF_IMAGE_URL: https://dnznrvs05pmza.cloudfront.net/gemini/gemini-3.1-flash-lite-image/images/b515dd04-fe2a-4edc-aa48-36ad6b4cc415/3525dcde-ea61-47f3-bc28-38aa758055e8/One_original_cinematic_high_quality_3D_animated_film_still_f.jpg?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiMjA1NTM2YzlhODhhMDVhZiIsImJ1Y2tldCI6InJ1bndheS10YXNrLWFydGlmYWN0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MTc5OTQ5N30.lybesht1fnoP5SCB0yB6VeC8lUjOrZpH90CuKbiViyI
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install 'gradio_client>=1.10,<3'
      - name: Check account configuration
        shell: bash
        run: |
          test -n "$HF_TOKEN" || { echo "::error::Set HF_TOKEN secret"; exit 1; }
      - name: Inspect official Space API
        run: python hf_cinematic.py --inspect
      - name: Generate one cinematic clip when reference image configured
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$HF_IMAGE_URL" ]; then
            echo "::error::Set repository Actions variable HF_IMAGE_URL to a publicly accessible original 9:16 character reference image. No video was generated."
            exit 1
          fi
          python generate_hindi_jobs.py
          python select_job.py
          if [ -f no_fresh_job ]; then
            echo "::error::No due unique Hindi job found for cinematic test"
            exit 1
          fi
          python prepare_cinematic.py
          python hf_cinematic.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hf-cinematic-test-clips
          path: cinematic_clips/
          if-no-files-found: ignore
          retention-days: 3
