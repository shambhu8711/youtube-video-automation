name: Verify existing YouTube Reel
on:
  push:
    paths: ['.github/workflows/verify-youtube.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: instagram-queue-single-writer
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install google-api-python-client==2.179.0 google-auth==2.40.3
      - name: Compile and self-test
        run: |
          python -m py_compile instagram_daily_queue.py
          python instagram_daily_queue.py self-test
      - name: Verify existing video without uploading
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: python instagram_daily_queue.py verify
      - name: Persist verification result
        if: always()
        run: |
          git config user.name "youtube-automation[bot]"
          git config user.email "youtube-automation[bot]@users.noreply.github.com"
          git add state/instagram_uploads/De4iEVhyYrV.json
          if ! git diff --cached --quiet; then
            git commit -m "Record existing Reel publication verification [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
