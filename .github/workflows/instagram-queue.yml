name: Instagram Daily Queue and Hourly YouTube Intake
on:
  push:
    paths:
      - 'instagram_daily_queue.py'
      - '.github/workflows/instagram-queue.yml'
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [collect, publish, test-upload, self-test]
        default: collect
  workflow_call:
    inputs:
      mode:
        type: string
        default: publish
  schedule:
    # 00:05 IST = 18:35 UTC previous day
    - cron: '35 18 * * *'
    # Hourly IST :15
    - cron: '45 * * * *'
permissions:
  contents: write
  actions: read
concurrency:
  group: instagram-queue-single-writer
  cancel-in-progress: false
jobs:
  queue:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      INSTAGRAM_REEL_URLS: ${{ vars.INSTAGRAM_REEL_URLS }}
      INSTAGRAM_SESSION_USERNAME: __sam__7399
      INSTAGRAM_SESSION_FILE: /tmp/instagram-session-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install video tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version
          ffprobe -version
      - name: Install dependencies
        run: pip install yt-dlp instaloader google-api-python-client==2.179.0 google-auth==2.40.3
      - name: Compile and self-test
        run: |
          python -m py_compile instagram_daily_queue.py
          python instagram_daily_queue.py self-test
      - name: Restore private Instagram session
        env:
          INSTAGRAM_SESSION_B64: ${{ secrets.INSTAGRAM_SESSION_B64 }}
        run: |
          python - <<'PY'
          import base64, os
          value = os.environ.get("INSTAGRAM_SESSION_B64", "")
          if value:
              data = base64.b64decode(value, validate=True)
              path = os.environ["INSTAGRAM_SESSION_FILE"]
              with open(os.open(path, os.O_WRONLY | os.O_CREAT | os.O_TRUNC, 0o600), "wb") as output:
                  output.write(data)
              print("Private Instagram session restored; contents are not logged.")
          else:
              print("Instagram session secret absent; using existing source fallback.")
          PY
      - name: Determine operation
        id: mode
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          INPUT_MODE: ${{ inputs.mode }}
        run: |
          if [ -n "$INPUT_MODE" ]; then
            echo "value=$INPUT_MODE" >> "$GITHUB_OUTPUT"
          elif [ "$EVENT_NAME" = "push" ]; then
            echo "value=self-test" >> "$GITHUB_OUTPUT"
          elif [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "value=$INPUT_MODE" >> "$GITHUB_OUTPUT"
          elif [ "$EVENT_SCHEDULE" = "35 18 * * *" ]; then
            echo "value=collect" >> "$GITHUB_OUTPUT"
          else
            echo "value=publish" >> "$GITHUB_OUTPUT"
          fi
      - name: Explain test requirements
        if: steps.mode.outputs.value == 'publish' || steps.mode.outputs.value == 'test-upload'
        run: |
          echo "## Instagram → YouTube automatic test" >> "$GITHUB_STEP_SUMMARY"
          echo "Event: ${{ github.event_name }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Mode: ${{ steps.mode.outputs.value }}" >> "$GITHUB_STEP_SUMMARY"
          missing=0
          for key in YOUTUBE_CLIENT_ID YOUTUBE_CLIENT_SECRET YOUTUBE_REFRESH_TOKEN; do
            if [ -z "${!key}" ]; then
              echo "::error::Missing GitHub Actions secret: $key"
              echo "- ❌ Missing required YouTube secret: $key" >> "$GITHUB_STEP_SUMMARY"
              missing=1
            else
              echo "- ✅ $key configured" >> "$GITHUB_STEP_SUMMARY"
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "YouTube publishing cannot work until the missing secrets are configured." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      - name: Download and validate actual Instagram Reel for test
        if: steps.mode.outputs.value == 'test-upload'
        run: |
          mkdir -p reel_queue
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          reel_id = "De4iEVhyYrV"
          url = "https://www.instagram.com/reel/" + reel_id + "/"
          if Path("state/instagram_uploads", reel_id + ".json").exists():
              raise SystemExit("This Reel already has an upload record; refusing a duplicate test.")
          subprocess.run(["yt-dlp", "--no-playlist", "--retries", "0", "--extractor-retries", "0", "--merge-output-format", "mp4", "--recode-video", "mp4", "-o", "reel_queue/" + reel_id + ".%(ext)s", url], check=True, timeout=240)
          video = Path("reel_queue", reel_id + ".mp4")
          if not video.is_file() or video.stat().st_size < 1024:
              raise SystemExit("Instagram download did not produce a valid video.")
          probe = json.loads(subprocess.check_output(["ffprobe", "-v", "error", "-show_entries", "format=duration:stream=codec_type,width,height", "-of", "json", str(video)]))
          stream = next((s for s in probe.get("streams", []) if s.get("codec_type") == "video"), None)
          duration = float(probe.get("format", {}).get("duration", 0))
          if not stream or not 0 < duration <= 180 or stream.get("height", 0) < stream.get("width", 0):
              raise SystemExit("Downloaded Reel does not meet Shorts duration and aspect requirements.")
          Path("reel_queue/manifest.json").write_text(json.dumps({"reels": [{"id": reel_id, "url": url, "title": "Tiny Giggle AI - Baby Comedy #Shorts"}]}))
          PY
      - name: Collect and validate daily videos
        env:
          INSTAGRAM_REEL_URLS: ${{ vars.INSTAGRAM_REEL_URLS }}
        if: steps.mode.outputs.value == 'collect'
        run: |
          for attempt in 1 2 3; do
            if python instagram_daily_queue.py collect; then exit 0; fi
            echo "::warning::Instagram collection failed (attempt $attempt). Check INSTAGRAM_DISCOVERY_FAILED or SKIP_REEL lines above."
            sleep 30
          done
          exit 1
      - name: Store today's videos as artifact
        if: steps.mode.outputs.value == 'collect' || steps.mode.outputs.value == 'bootstrap'
        uses: actions/upload-artifact@v4
        with:
          name: instagram-daily-queue
          path: reel_queue/
          retention-days: 3
          if-no-files-found: error
      - name: Restore most recent collected queue
        id: restore
        if: steps.mode.outputs.value == 'publish'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          found=0
          for id in $(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" --jq '.artifacts | sort_by(.created_at) | reverse | .[] | select(.name == "instagram-daily-queue" and .expired == false) | .workflow_run.id'); do
            if gh run download "$id" --name instagram-daily-queue --dir reel_queue 2>/dev/null; then
              found=1
              break
            fi
          done
          if [ "$found" -eq 1 ]; then
            if ! python - <<'PY'
          import json, sys
          from pathlib import Path
          root = Path("reel_queue")
          data = json.loads((root / "manifest.json").read_text())
          done = {p.stem for p in Path("state/instagram_uploads").glob("*.json")}
          usable = any(x["id"] not in done and (root / (x["id"] + ".mp4")).is_file() for x in data.get("reels", []))
          sys.exit(0 if usable else 1)
          PY
            then
              found=0
            fi
          fi
          if [ "$found" -ne 1 ]; then
            echo "::notice::Queue missing or exhausted; collecting new Reels automatically"
            python instagram_daily_queue.py collect
            echo "refreshed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Store automatically refilled queue
        if: steps.restore.outputs.refreshed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: instagram-daily-queue
          path: reel_queue/
          retention-days: 3
          if-no-files-found: error
      - name: Clear old upload record for this run
        if: steps.mode.outputs.value == 'test-upload'
        run: rm -f instagram_upload_record.json
      - name: Upload one public video
        if: steps.mode.outputs.value == 'publish' || steps.mode.outputs.value == 'test-upload'
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          for attempt in 1 2 3; do
            if python instagram_daily_queue.py publish; then exit 0; fi
            # Never blindly retry an accepted upload: preserve its record first.
            if [ -f instagram_upload_record.json ]; then
              echo "::error::Upload was accepted but the step failed; do not retry blindly"
              exit 1
            fi
            echo "::warning::Publishing attempt $attempt failed"
            sleep 30
          done
          exit 1
      - name: Report queue and upload state
        if: always()
        run: |
          echo "## Test outcome" >> "$GITHUB_STEP_SUMMARY"
          if [ -f reel_queue/manifest.json ]; then
            python -c 'import json; x=json.load(open("reel_queue/manifest.json")); print("QUEUE_COUNT",len(x.get("reels",[])))'
          fi
          if [ -f instagram_upload_record.json ]; then
            python -c 'import json,os; x=json.load(open("instagram_upload_record.json")); print("VIDEO_ID",x.get("youtube_video_id")); print("PUBLICATION_VERIFIED",x.get("publication_verified")); open(os.environ["GITHUB_STEP_SUMMARY"],"a").write("YouTube video: https://www.youtube.com/watch?v="+x["youtube_video_id"]+"\\n\\nPublication verified: "+str(x.get("publication_verified"))+"\\n")'
          else
            echo "No YouTube upload record created in this run." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Persist upload ID even after later failures
        if: always()
        run: |
          if [ -f instagram_upload_record.json ]; then
            mkdir -p state/instagram_uploads
            python -c 'import json,shutil; x=json.load(open("instagram_upload_record.json"));shutil.copyfile("instagram_upload_record.json","state/instagram_uploads/"+x["instagram_reel_id"]+".json")'
            git config user.name "youtube-automation[bot]"
            git config user.email "youtube-automation[bot]@users.noreply.github.com"
            git add state/instagram_uploads/
            if ! git diff --cached --quiet; then
              git commit -m "Track Instagram intake [skip ci]"
              git pull --rebase origin main
              git push origin HEAD:main
            fi
          fi
      - name: Remove temporary Instagram session
        if: always()
        run: rm -f "$INSTAGRAM_SESSION_FILE"
