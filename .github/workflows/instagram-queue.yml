name: Instagram Daily Queue and Hourly YouTube Intake
on:
  push:
    paths:
      - 'instagram_daily_queue.py'
      - '.github/workflows/instagram-queue.yml'
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [collect, publish]
        default: collect
  schedule:
    # 00:05 IST = 18:35 UTC previous day
    - cron: '35 18 * * *'
    # Hourly IST :15, excluding daily collection slot
    - cron: '45 * * * *'
permissions:
  contents: write
  actions: read
concurrency:
  group: instagram-queue-single-writer
  cancel-in-progress: false
jobs:
  queue:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install yt-dlp google-api-python-client==2.179.0 google-auth==2.40.3
      - name: Compile and self-test
        run: |
          python -m py_compile instagram_daily_queue.py
          python instagram_daily_queue.py self-test
      - name: Determine operation
        id: mode
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          INPUT_MODE: ${{ inputs.mode }}
        run: |
          if [ "$EVENT_NAME" = "push" ]; then
            echo "value=bootstrap" >> "$GITHUB_OUTPUT"
          elif [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "value=$INPUT_MODE" >> "$GITHUB_OUTPUT"
          elif [ "$EVENT_SCHEDULE" = "35 18 * * *" ]; then
            echo "value=collect" >> "$GITHUB_OUTPUT"
          else
            echo "value=publish" >> "$GITHUB_OUTPUT"
          fi
      - name: Collect and validate daily videos
        if: steps.mode.outputs.value == 'collect' || steps.mode.outputs.value == 'bootstrap'
        run: |
          for attempt in 1 2 3; do
            if python instagram_daily_queue.py collect; then exit 0; fi
            echo "::warning::Instagram collection failed (attempt $attempt)"
            sleep 30
          done
          exit 1
      - name: Store today's videos as artifact
        if: steps.mode.outputs.value == 'collect' || steps.mode.outputs.value == 'bootstrap'
        uses: actions/upload-artifact@v4
        with:
          name: instagram-daily-queue
          path: reel_queue/
          retention-days: 3
          if-no-files-found: error
      - name: Restore most recent collected queue
        if: steps.mode.outputs.value == 'publish'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          found=0
          for id in $(gh run list --workflow instagram-queue.yml --status success --limit 60 --json databaseId --jq '.[].databaseId'); do
            if gh run download "$id" --name instagram-daily-queue --dir reel_queue 2>/dev/null; then
              found=1
              break
            fi
          done
          if [ "$found" -ne 1 ]; then
            echo "::warning::No daily collection artifact; attempting on-demand collection"
            python instagram_daily_queue.py collect
          fi
      - name: Upload one public video
        if: steps.mode.outputs.value == 'publish' || steps.mode.outputs.value == 'bootstrap'
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          for attempt in 1 2 3; do
            if python instagram_daily_queue.py publish; then exit 0; fi
            # Never blindly retry an accepted upload: preserve its record first.
            if [ -f instagram_upload_record.json ]; then
              echo "::error::Upload was accepted but the step failed; do not retry blindly"
              exit 1
            fi
            echo "::warning::Publishing attempt $attempt failed"
            sleep 30
          done
          exit 1
      - name: Report queue and upload state
        if: always()
        run: |
          if [ -f reel_queue/manifest.json ]; then
            python -c 'import json; x=json.load(open("reel_queue/manifest.json")); print("QUEUE_COUNT",len(x.get("reels",[])))'
          fi
          if [ -f instagram_upload_record.json ]; then
            python -c 'import json; x=json.load(open("instagram_upload_record.json")); print("VIDEO_ID",x.get("youtube_video_id")); print("PUBLICATION_VERIFIED",x.get("publication_verified"))'
          fi
      - name: Persist upload ID even after later failures
        if: always()
        run: |
          if [ -f instagram_upload_record.json ]; then
            mkdir -p state/instagram_uploads
            python -c 'import json,shutil; x=json.load(open("instagram_upload_record.json"));shutil.copyfile("instagram_upload_record.json","state/instagram_uploads/"+x["instagram_reel_id"]+".json")'
            git config user.name "youtube-automation[bot]"
            git config user.email "youtube-automation[bot]@users.noreply.github.com"
            git add state/instagram_uploads/
            if ! git diff --cached --quiet; then
              git commit -m "Track Instagram intake [skip ci]"
              git pull --rebase origin main
              git push origin HEAD:main
            fi
          fi
