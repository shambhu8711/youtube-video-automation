name: Instagram Daily Queue and Hourly YouTube Intake
on:
  push:
    paths:
      - 'instagram_daily_queue.py'
      - '.github/workflows/instagram-queue.yml'
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [collect, publish, test-upload]
        default: collect
  schedule:
    # 00:05 IST = 18:35 UTC previous day
    - cron: '35 18 * * *'
    # Hourly IST :15, excluding daily collection slot
    - cron: '45 * * * *'
permissions:
  contents: write
  actions: read
concurrency:
  group: instagram-queue-single-writer
  cancel-in-progress: false
jobs:
  queue:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install video tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version
          ffprobe -version
      - name: Install dependencies
        run: pip install yt-dlp instaloader google-api-python-client==2.179.0 google-auth==2.40.3
      - name: Compile and self-test
        run: |
          python -m py_compile instagram_daily_queue.py
          python instagram_daily_queue.py self-test
      - name: Determine operation
        id: mode
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          INPUT_MODE: ${{ inputs.mode }}
        run: |
          if [ "$EVENT_NAME" = "push" ]; then
            echo "value=test-upload" >> "$GITHUB_OUTPUT"
          elif [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "value=$INPUT_MODE" >> "$GITHUB_OUTPUT"
          elif [ "$EVENT_SCHEDULE" = "35 18 * * *" ]; then
            echo "value=collect" >> "$GITHUB_OUTPUT"
          else
            echo "value=publish" >> "$GITHUB_OUTPUT"
          fi
      - name: Explain test requirements
        if: steps.mode.outputs.value == 'publish' || steps.mode.outputs.value == 'test-upload'
        run: |
          echo "## Instagram → YouTube automatic test" >> "$GITHUB_STEP_SUMMARY"
          echo "Event: ${{ github.event_name }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Mode: ${{ steps.mode.outputs.value }}" >> "$GITHUB_STEP_SUMMARY"
          missing=0
          for key in YOUTUBE_CLIENT_ID YOUTUBE_CLIENT_SECRET YOUTUBE_REFRESH_TOKEN; do
            if [ -z "${!key}" ]; then
              echo "::error::Missing GitHub Actions secret: $key"
              echo "- ❌ Missing required YouTube secret: $key" >> "$GITHUB_STEP_SUMMARY"
              missing=1
            else
              echo "- ✅ $key configured" >> "$GITHUB_STEP_SUMMARY"
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "YouTube publishing cannot work until the missing secrets are configured." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      - name: Generate original vertical test video (no Instagram dependency)
        if: steps.mode.outputs.value == 'test-upload'
        run: |
          mkdir -p reel_queue
          ffmpeg -hide_banner -loglevel error -f lavfi -i "color=c=navy:s=720x1280:r=24:d=8" -f lavfi -i "sine=frequency=440:duration=8" -c:v libx264 -pix_fmt yuv420p -c:a aac -shortest -y reel_queue/youtube_connection_test.mp4
          python - <<'PY'
          import json, os
          from pathlib import Path
          test_id = "youtube_connection_test_" + os.environ["GITHUB_RUN_ID"] + "_" + os.environ["GITHUB_RUN_ATTEMPT"]
          Path("reel_queue/youtube_connection_test.mp4").rename(Path("reel_queue") / (test_id + ".mp4"))
          Path("reel_queue/manifest.json").write_text(json.dumps({"reels": [{"id": test_id, "url": "https://www.youtube.com/", "title": "YouTube Upload Connection Test #Shorts"}]}))
          PY
      - name: Collect and validate daily videos
        env:
          INSTAGRAM_REEL_URLS: ${{ vars.INSTAGRAM_REEL_URLS }}
        if: steps.mode.outputs.value == 'collect'
        run: |
          for attempt in 1 2 3; do
            if python instagram_daily_queue.py collect; then exit 0; fi
            echo "::warning::Instagram collection failed (attempt $attempt). Check INSTAGRAM_DISCOVERY_FAILED or SKIP_REEL lines above."
            sleep 30
          done
          exit 1
      - name: Store today's videos as artifact
        if: steps.mode.outputs.value == 'collect' || steps.mode.outputs.value == 'bootstrap'
        uses: actions/upload-artifact@v4
        with:
          name: instagram-daily-queue
          path: reel_queue/
          retention-days: 3
          if-no-files-found: error
      - name: Restore most recent collected queue
        if: steps.mode.outputs.value == 'publish'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          found=0
          for id in $(gh run list --workflow instagram-queue.yml --status success --limit 60 --json databaseId --jq '.[].databaseId'); do
            if gh run download "$id" --name instagram-daily-queue --dir reel_queue 2>/dev/null; then
              found=1
              break
            fi
          done
          if [ "$found" -ne 1 ]; then
            echo "::warning::No daily collection artifact; attempting on-demand collection"
            python instagram_daily_queue.py collect
          fi
      - name: Clear old upload record for this run
        if: steps.mode.outputs.value == 'test-upload'
        run: rm -f instagram_upload_record.json
      - name: Upload one public video
        if: steps.mode.outputs.value == 'publish' || steps.mode.outputs.value == 'test-upload'
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          for attempt in 1 2 3; do
            if python instagram_daily_queue.py publish; then exit 0; fi
            # Never blindly retry an accepted upload: preserve its record first.
            if [ -f instagram_upload_record.json ]; then
              echo "::error::Upload was accepted but the step failed; do not retry blindly"
              exit 1
            fi
            echo "::warning::Publishing attempt $attempt failed"
            sleep 30
          done
          exit 1
      - name: Report queue and upload state
        if: always()
        run: |
          echo "## Test outcome" >> "$GITHUB_STEP_SUMMARY"
          if [ -f reel_queue/manifest.json ]; then
            python -c 'import json; x=json.load(open("reel_queue/manifest.json")); print("QUEUE_COUNT",len(x.get("reels",[])))'
          fi
          if [ -f instagram_upload_record.json ]; then
            python -c 'import json,os; x=json.load(open("instagram_upload_record.json")); print("VIDEO_ID",x.get("youtube_video_id")); print("PUBLICATION_VERIFIED",x.get("publication_verified")); open(os.environ["GITHUB_STEP_SUMMARY"],"a").write("YouTube video: https://www.youtube.com/watch?v="+x["youtube_video_id"]+"\\n\\nPublication verified: "+str(x.get("publication_verified"))+"\\n")'
          else
            echo "No YouTube upload record created in this run." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Persist upload ID even after later failures
        if: always()
        run: |
          if [ -f instagram_upload_record.json ]; then
            mkdir -p state/instagram_uploads
            python -c 'import json,shutil; x=json.load(open("instagram_upload_record.json"));shutil.copyfile("instagram_upload_record.json","state/instagram_uploads/"+x["instagram_reel_id"]+".json")'
            git config user.name "youtube-automation[bot]"
            git config user.email "youtube-automation[bot]@users.noreply.github.com"
            git add state/instagram_uploads/
            if ! git diff --cached --quiet; then
              git commit -m "Track Instagram intake [skip ci]"
              git pull --rebase origin main
              git push origin HEAD:main
            fi
          fi
