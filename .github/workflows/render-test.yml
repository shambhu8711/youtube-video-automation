name: Shorts Renderer Acceptance
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          pip install pillow edge-tts
      - name: Female narration
        run: edge-tts --voice en-US-AriaNeural --rate=-5% --text "Venus has one of the strangest days in our solar system. It takes about 243 Earth days to rotate once, but only about 225 Earth days to orbit the Sun. That means its year is shorter than its rotation period. Space is weird. Follow for more surprising science." --write-media voice.mp3 --write-subtitles captions.vtt
      - name: Animated graphics
        run: python render.py
      - name: Final exact MP4
        run: |
          ffmpeg -y -framerate 30 -i frames/%05d.png -i voice.mp3 -vf "subtitles=captions.vtt:force_style='FontName=DejaVu Sans,FontSize=18,Outline=2,Alignment=2,MarginV=90'" -c:v libx264 -crf 21 -preset medium -pix_fmt yuv420p -c:a aac -b:a 160k -af loudnorm=I=-15:TP=-1:LRA=7 -shortest final_short.mp4
      - name: Exact-file QA
        run: |
          ffprobe -v error -show_entries stream=codec_type,width,height,r_frame_rate -show_entries format=duration -of json final_short.mp4 > ffprobe.json
          ffmpeg -i final_short.mp4 -filter_complex ebur128=peak=true -f null - 2> loudness.txt || true
          python - <<'PY'
          import json
          j=json.load(open("ffprobe.json")); s=j["streams"]
          v=next((x for x in s if x["codec_type"]=="video"),None); a=next((x for x in s if x["codec_type"]=="audio"),None)
          assert v and a
          assert (v["width"],v["height"])==(1080,1920)
          assert float(j["format"]["duration"])>12
          print("TECHNICAL_QA_PASS")
          PY
          mkdir motion
          for t in 2 6 10 14 18; do ffmpeg -loglevel error -ss $t -i final_short.mp4 -frames:v 1 motion/$t.png; done
          sha256sum motion/*.png > motion_hashes.txt
          test "$(cut -d' ' -f1 motion_hashes.txt | sort -u | wc -l)" -ge 4
      - uses: actions/upload-artifact@v4
        with:
          name: acceptance-test-short
          path: |
            final_short.mp4
            ffprobe.json
            loudness.txt
            motion_hashes.txt
          retention-days: 7
