name: Hourly YouTube Shorts
on:
  workflow_dispatch:
    inputs:
      job_file:
        description: Job JSON file in jobs/
        required: false
        type: string
  schedule:
    # GitHub cron is UTC. :30 UTC = top of the hour IST.
    - cron: '30 * * * *'

concurrency:
  group: hourly-youtube-short
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install renderer
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          pip install pillow edge-tts faster-whisper
      - name: Select fresh job
        id: select
        env:
          MANUAL_JOB: ${{ inputs.job_file }}
        run: |
          python select_job.py
          echo "job_key=$(python -c 'import json; print(json.load(open("selected_job.json"))["job_key"])')" >> "$GITHUB_OUTPUT"
      - name: Female narration
        run: |
          python - <<'PY'
          import json
          j=json.load(open("selected_job.json"))
          open("intended.txt","w").write(j["script"])
          PY
          edge-tts --voice en-US-AriaNeural --rate=-5% --text "$(cat intended.txt)" --write-media voice.mp3 --write-subtitles captions.vtt
      - name: Animated graphics
        run: python render.py
      - name: Final exact MP4
        run: |
          ffmpeg -y -framerate 30 -i frames/%05d.png -i voice.mp3 -vf "subtitles=captions.vtt:force_style='FontName=DejaVu Sans,FontSize=18,Outline=2,Alignment=2,MarginV=90'" -c:v libx264 -crf 21 -preset medium -pix_fmt yuv420p -c:a aac -b:a 160k -af loudnorm=I=-15:TP=-1:LRA=7 -shortest final_short.mp4
      - name: Exact-file QA
        run: |
          ffprobe -v error -show_entries stream=codec_type,width,height,r_frame_rate -show_entries format=duration -of json final_short.mp4 > ffprobe.json
          ffmpeg -i final_short.mp4 -filter_complex ebur128=peak=true -f null - 2> loudness.txt || true
          ffmpeg -y -i final_short.mp4 -vn -ac 1 -ar 16000 exact_audio.wav
          python - <<'PY'
          import json,re,difflib
          from faster_whisper import WhisperModel
          j=json.load(open("ffprobe.json")); s=j["streams"]
          v=next((x for x in s if x["codec_type"]=="video"),None); a=next((x for x in s if x["codec_type"]=="audio"),None)
          assert v and a and (v["width"],v["height"])==(1080,1920)
          assert float(j["format"]["duration"])>18
          model=WhisperModel("tiny.en",device="cpu",compute_type="int8")
          segs,_=model.transcribe("exact_audio.wav")
          transcript=" ".join(x.text for x in segs).strip()
          open("transcript.txt","w").write(transcript)
          norm=lambda x: re.sub(r"[^a-z0-9 ]","",x.lower())
          intended=open("intended.txt").read().strip()
          score=difflib.SequenceMatcher(None,norm(intended),norm(transcript)).ratio()
          open("transcript_score.txt","w").write(str(score))
          assert score>=0.72,(score,transcript)
          print("EXACT_FINAL_SPEECH_QA_PASS",score)
          PY
          mkdir motion
          for t in 2 6 10 14 18; do ffmpeg -loglevel error -ss $t -i final_short.mp4 -frames:v 1 motion/$t.png; done
          sha256sum motion/*.png > motion_hashes.txt
          test "$(cut -d' ' -f1 motion_hashes.txt | sort -u | wc -l)" -ge 4
      - uses: actions/upload-artifact@v4
        with:
          name: short-${{ steps.select.outputs.job_key }}
          path: |
            final_short.mp4
            selected_job.json
            ffprobe.json
            loudness.txt
            motion_hashes.txt
            transcript.txt
            transcript_score.txt
            intended.txt
          retention-days: 7
