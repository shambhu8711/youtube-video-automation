name: Two-Hour YouTube Shorts
on:
  workflow_dispatch:
    inputs:
      job_file:
        description: Job JSON file in jobs/
        required: false
        type: string
  schedule:
    - cron: '30 */2 * * * *'

permissions:
  contents: write

concurrency:
  group: youtube-shorts-production
  cancel-in-progress: false

jobs:
  render-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Preflight YouTube credentials
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for n in YOUTUBE_CLIENT_ID YOUTUBE_CLIENT_SECRET YOUTUBE_REFRESH_TOKEN; do
            if [ -z "${!n:-}" ]; then echo "::error::Missing GitHub Actions secret: $n"; missing=1; fi
          done
          test "$missing" -eq 0
      - name: Install production tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          pip install pillow edge-tts faster-whisper google-api-python-client google-auth
      - name: Ensure today's content queue exists
        run: python generate_daily_jobs.py
      - name: Select fresh job
        id: select
        env:
          MANUAL_JOB: ${{ inputs.job_file }}
        run: |
          python select_job.py
          if [ -f no_fresh_job ]; then
            echo "has_job=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_job=true" >> "$GITHUB_OUTPUT"
            echo "job_key=$(python -c 'import json; print(json.load(open("selected_job.json"))["job_key"])')" >> "$GITHUB_OUTPUT"
          fi
      - name: Render and exact-file QA
        if: steps.select.outputs.has_job == 'true'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf frames motion voice.mp3 captions.vtt final_short.mp4 exact_audio.wav ffprobe.json loudness.txt transcript.txt transcript_score.txt motion_hashes.txt intended.txt visual_signature.txt youtube_result.json youtube_upload_state.json
          mkdir -p frames
          python -c 'import json; j=json.load(open("selected_job.json")); open("intended.txt","w").write(j["script"])'
          edge-tts --voice en-US-AriaNeural --rate=-5% --text "$(cat intended.txt)" --write-media voice.mp3 --write-subtitles captions.vtt
          python render.py
          ffmpeg -y -framerate 30 -i frames/%05d.png -i voice.mp3 -vf "subtitles=captions.vtt:force_style='FontName=DejaVu Sans,FontSize=18,Outline=2,Alignment=2,MarginV=90'" -c:v libx264 -crf 23 -preset ultrafast -pix_fmt yuv420p -c:a aac -b:a 160k -af loudnorm=I=-15:TP=-1:LRA=7 -shortest final_short.mp4
          ffprobe -v error -show_entries stream=codec_type,width,height,r_frame_rate -show_entries format=duration -of json final_short.mp4 > ffprobe.json
          ffmpeg -y -i final_short.mp4 -vn -ac 1 -ar 16000 exact_audio.wav
          python qa_exact.py
          mkdir -p motion
          for t in 2 6 10 14 18; do ffmpeg -loglevel error -ss $t -i final_short.mp4 -frames:v 1 motion/$t.png; done
          sha256sum motion/*.png > motion_hashes.txt
          test "$(cut -d' ' -f1 motion_hashes.txt | sort -u | wc -l)" -ge 4
          test -s visual_signature.txt
          ffmpeg -i final_short.mp4 -filter_complex ebur128=peak=true -f null - 2> loudness.txt || true
      - name: Upload directly to YouTube
        if: steps.select.outputs.has_job == 'true'
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        shell: bash
        run: |
          set -uo pipefail
          for attempt in 1 2 3; do
            echo "YouTube upload attempt $attempt/3"
            python youtube_publish.py --video final_short.mp4 --job selected_job.json --privacy public
            rc=$?
            if [ "$rc" -eq 0 ]; then exit 0; fi
            if [ "$rc" -eq 79 ]; then echo "::warning::YouTube channel upload limit reached; preserving this slot for later recovery"; exit "$rc"; fi
            if [ "$rc" -eq 78 ]; then echo "::error::Non-retriable OAuth/config/API error"; exit "$rc"; fi
            if [ "$attempt" -lt 3 ]; then echo "Transient upload failure; retrying in 5 minutes"; sleep 300; fi
          done
          exit 1
      - name: Persist accepted upload state
        if: steps.select.outputs.has_job == 'true' && success()
        shell: bash
        run: |
          set -euo pipefail
          test -s youtube_upload_state.json
          mkdir -p state/uploads
          cp youtube_upload_state.json "state/uploads/${{ steps.select.outputs.job_key }}.json"
          git config user.name "youtube-automation[bot]"
          git config user.email "youtube-automation[bot]@users.noreply.github.com"
          git add state/uploads/
          if ! git diff --cached --quiet; then
            git commit -m "Record YouTube upload ${{ steps.select.outputs.job_key }} [skip ci]"
            for n in 1 2 3; do
              git pull --rebase origin main && git push origin HEAD:main && break
              test "$n" -lt 3 || exit 1
              sleep 10
            done
          fi
      - uses: actions/upload-artifact@v4
        if: always() && steps.select.outputs.has_job == 'true'
        with:
          name: short-${{ steps.select.outputs.job_key }}
          path: |
            final_short.mp4
            selected_job.json
            youtube_result.json
            youtube_upload_state.json
            ffprobe.json
            loudness.txt
            motion_hashes.txt
            transcript.txt
            transcript_score.txt
            intended.txt
            visual_signature.txt
          if-no-files-found: ignore
          retention-days: 14
