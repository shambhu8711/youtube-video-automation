name: Two-Hour YouTube Shorts
on:
  workflow_dispatch:
    inputs:
      job_file:
        description: Job JSON file in jobs/
        required: false
        type: string
  schedule:
    # Every 2 hours at :00 IST (GitHub Actions cron is UTC, 5 fields)
    # Staggered recovery checks: every 30 minutes at :17/:47 UTC.
    # select_job.py only selects due unuploaded jobs, so extra checks do not create duplicates.
    - cron: '17,47 * * * *'
  push:
    branches: [main]
    paths:
      - 'state/uploads/*.json'
      - 'generate_hindi_jobs.py'
      - 'select_job.py'
      - 'render_hindi.py'
      - 'generate_hindi_audio.py'
      - 'script_bank/**'
      - '.github/workflows/render-test.yml'

# Recovery trigger: 2026-10-09 missing due Shorts (automated backlog retry)
# Recovery re-trigger: 2026-10-09 user-requested missed-slot replay
permissions:
  contents: write

concurrency:
  group: youtube-shorts-production
  cancel-in-progress: false

jobs:
  render-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Require cinematic AI video renderer before publishing
        shell: bash
        run: |
          echo "::error::Publishing paused: current Pillow cartoon renderer cannot meet approved realistic 3D cinematic reference. AI video generation and visual/lip-sync QA integration required. No video will be uploaded."
          exit 1
      - name: Preflight YouTube credentials
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for n in YOUTUBE_CLIENT_ID YOUTUBE_CLIENT_SECRET YOUTUBE_REFRESH_TOKEN; do
            if [ -z "${!n:-}" ]; then echo "::error::Missing GitHub Actions secret: $n"; missing=1; fi
          done
          test "$missing" -eq 0
      - name: Install production tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core
          pip install -r requirements-production.txt
      - name: Ensure today's content queue exists
        run: python generate_hindi_jobs.py
      - name: Drain all due Shorts backlog
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          MANUAL_JOB: ${{ inputs.job_file }}
        shell: bash
        run: |
          set -uo pipefail
          processed=0
          while [ "$processed" -lt 12 ]; do
            rm -f no_fresh_job selected_job.json youtube_result.json youtube_upload_state.json
            python select_job.py
            if [ -f no_fresh_job ]; then
              echo "BACKLOG_DRAINED processed=$processed"
              exit 0
            fi
            job_key="$(python -c 'import json; print(json.load(open("selected_job.json"))["job_key"])')"
            echo "BACKLOG_SELECTED $job_key"
            rm -rf frames motion voice.mp3 captions.vtt final_short.mp4 exact_audio.wav ffprobe.json loudness.txt transcript.txt transcript_score.txt motion_hashes.txt intended.txt visual_signature.txt
            mkdir -p frames
            python -c 'import json; j=json.load(open("selected_job.json")); open("intended.txt","w").write(j["script"])'
            # Per-speaker Hindi TTS with measured dialogue timestamps and audio-energy lip motion.
            tts_ok=0
            for tts_attempt in 1 2 3; do
              rm -rf speech_segments speech_timeline.json voice.mp3 captions.vtt
              if python generate_hindi_audio.py && test -s voice.mp3 && test -s captions.vtt && test -s speech_timeline.json; then
                tts_ok=1
                break
              fi
              if [ "$tts_attempt" -lt 3 ]; then sleep $((tts_attempt * 20)); fi
            done
            if [ "$tts_ok" -ne 1 ]; then
              echo "::error::Hindi dialogue TTS failed; no upload"
              exit 1
            fi
            python render_hindi.py
            ffmpeg -y -framerate 30 -i frames/%05d.png -i voice.mp3 -vf "subtitles=captions.vtt:force_style='FontName=Noto Sans Devanagari,FontSize=18,Outline=2,Alignment=2,MarginV=90'" -c:v libx264 -crf 23 -preset ultrafast -pix_fmt yuv420p -c:a aac -b:a 160k -af loudnorm=I=-15:TP=-1:LRA=7 -shortest final_short.mp4
            ffprobe -v error -show_entries stream=codec_type,width,height,r_frame_rate -show_entries format=duration -of json final_short.mp4 > ffprobe.json
            ffmpeg -y -i final_short.mp4 -vn -ac 1 -ar 16000 exact_audio.wav
            python -c 'import json; d=json.load(open("ffprobe.json")); assert any(x.get("codec_type")=="video" and x.get("width")==1080 and x.get("height")==1920 for x in d["streams"]); assert any(x.get("codec_type")=="audio" for x in d["streams"]); assert 18<=float(d["format"]["duration"])<=60; print("HINDI_TECHNICAL_QA_PASS")'
            mkdir -p motion
            for t in 2 6 10 14 18; do ffmpeg -loglevel error -ss $t -i final_short.mp4 -frames:v 1 motion/$t.png; done
            sha256sum motion/*.png > motion_hashes.txt
            test "$(cut -d' ' -f1 motion_hashes.txt | sort -u | wc -l)" -ge 4
            echo 'Hindi dialogue scene renderer' > visual_signature.txt
            test -s visual_signature.txt
            uploaded=0
            for attempt in 1 2 3; do
              echo "YouTube upload attempt $attempt/3 for $job_key"
              python youtube_publish.py --video final_short.mp4 --job selected_job.json --privacy public
              rc=$?
              if [ "$rc" -eq 0 ]; then uploaded=1; break; fi
              if [ "$rc" -eq 79 ]; then echo "::warning::Upload limit reached; backlog preserved"; exit 79; fi
              if [ "$rc" -eq 78 ]; then echo "::error::Non-retriable OAuth/config/API error"; exit 78; fi
              if [ "$attempt" -lt 3 ]; then sleep 300; fi
            done
            test "$uploaded" -eq 1
            mkdir -p state/uploads
            cp youtube_upload_state.json "state/uploads/$job_key.json"
            git config user.name "youtube-automation[bot]"
            git config user.email "youtube-automation[bot]@users.noreply.github.com"
            git add "state/uploads/$job_key.json"
            git commit -m "Record YouTube upload $job_key [skip ci]"
            for n in 1 2 3; do
              git pull --rebase origin main && git push origin HEAD:main && break
              test "$n" -lt 3 || exit 1
              sleep 10
            done
            processed=$((processed+1))
            unset MANUAL_JOB
            echo "BACKLOG_ITEM_COMPLETE $job_key"
          done
          echo "BACKLOG_BATCH_LIMIT_REACHED processed=$processed"
