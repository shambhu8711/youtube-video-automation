name: Daily Long Form Video
on:
  workflow_dispatch:
  schedule:
    # 10:30, 15:30 and 20:30 IST = 05:00, 10:00 and 15:00 UTC
    - cron: '0 5,10,15 * * *'
permissions:
  contents: write
concurrency:
  group: daily-long-form
  cancel-in-progress: false
jobs:
  render-long:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install production tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          pip install pillow edge-tts google-api-python-client google-auth
      - name: Build narration and video
        run: |
          cp longform/jobs/current.json longform_job.json
          python -c 'import json; j=json.load(open("longform_job.json")); open("long_script.txt","w").write(j["script"])'
          edge-tts --voice en-US-AriaNeural --rate=-4% --text "$(cat long_script.txt)" --write-media long_voice.mp3 --write-subtitles long_captions.vtt
          python longform/render_long.py
          ffmpeg -y -framerate 30 -i long_frames/%05d.jpg -i long_voice.mp3 -vf "subtitles=long_captions.vtt:force_style='FontName=DejaVu Sans,FontSize=22,Outline=2,Alignment=2,MarginV=55'" -c:v libx264 -preset veryfast -crf 24 -pix_fmt yuv420p -c:a aac -b:a 160k -af loudnorm=I=-15:TP=-1:LRA=7 -shortest longform.mp4
      - name: Exact-file QA
        run: |
          ffprobe -v error -show_entries stream=codec_type,width,height -show_entries format=duration -of json longform.mp4 > long_ffprobe.json
          python - <<'PY'
          import json
          j=json.load(open("long_ffprobe.json")); s=j["streams"]
          v=next(x for x in s if x["codec_type"]=="video")
          assert (v["width"],v["height"])==(1920,1080)
          assert any(x["codec_type"]=="audio" for x in s)
          d=float(j["format"]["duration"]); assert 120 <= d <= 900,d
          PY
      - name: Publish long-form directly to YouTube
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,datetime
          j=json.load(open("longform_job.json"))
          # Each scheduled edition needs a durable key. Existing explicit key is retained.
          if not j.get("job_key"):
              now=datetime.datetime.now(datetime.timezone(datetime.timedelta(hours=5,minutes=30)))
              j["job_key"]="long-"+now.strftime("%Y%m%d-%H%M")
          json.dump(j,open("longform_job.json","w"),ensure_ascii=False)
          PY
          KEY=$(python -c 'import json; print(json.load(open("longform_job.json"))["job_key"])')
          if [ -f "state/uploads/$KEY.json" ]; then
            echo "ALREADY_PUBLISHED $KEY"
            cp "state/uploads/$KEY.json" youtube_upload_state.json
          else
            for attempt in 1 2 3; do
              python youtube_publish.py --video longform.mp4 --job longform_job.json --privacy public && break
              rc=$?
              test "$rc" -ne 78 || exit "$rc"
              test "$attempt" -lt 3 || exit "$rc"
              sleep 300
            done
            test -s youtube_upload_state.json
            mkdir -p state/uploads
            cp youtube_upload_state.json "state/uploads/$KEY.json"
            git config user.name "youtube-automation[bot]"
            git config user.email "youtube-automation[bot]@users.noreply.github.com"
            git add state/uploads/
            if ! git diff --cached --quiet; then
              git commit -m "Record long-form YouTube upload $KEY [skip ci]"
              for n in 1 2 3; do
                git pull --rebase origin main && git push origin HEAD:main && break
                test "$n" -lt 3 || exit 1
                sleep 10
              done
            fi
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: daily-long-form-${{ github.run_id }}
          path: |
            longform.mp4
            longform_job.json
            long_ffprobe.json
          retention-days: 14
