name: Production queue readiness check
on:
  push:
    paths: ['.github/workflows/production-queue-check.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      INSTAGRAM_SESSION_USERNAME: __sam__7399
      INSTAGRAM_SESSION_FILE: ${{ runner.temp }}/instagram-session
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          pip install yt-dlp instaloader
      - name: Compile and check duplicate filtering
        run: |
          python -m py_compile instagram_daily_queue.py
          python instagram_daily_queue.py self-test
      - name: Restore private Instagram session
        env:
          INSTAGRAM_SESSION_B64: ${{ secrets.INSTAGRAM_SESSION_B64 }}
        run: |
          python - <<'PY'
          import base64, os
          value = os.environ.get("INSTAGRAM_SESSION_B64", "")
          if value:
              data = base64.b64decode(value, validate=True)
              path = os.environ["INSTAGRAM_SESSION_FILE"]
              with open(os.open(path, os.O_WRONLY | os.O_CREAT | os.O_TRUNC, 0o600), "wb") as output:
                  output.write(data)
              print("Private Instagram session restored; contents are not logged.")
          else:
              print("Instagram session secret absent; using existing source fallback.")
          PY
      - name: Verify authenticated discovery without fallback
        run: |
          timeout 90s python -u - <<'PY'
          import os
          from pathlib import Path
          import instaloader
          session = Path(os.environ["INSTAGRAM_SESSION_FILE"])
          if not session.is_file():
              raise SystemExit("AUTH_SESSION_MISSING: GitHub did not receive INSTAGRAM_SESSION_B64")
          loader = instaloader.Instaloader(quiet=True, max_connection_attempts=1, request_timeout=20)
          loader.load_session_from_file(os.environ["INSTAGRAM_SESSION_USERNAME"], str(session))
          try:
              username = loader.test_login()
              if username != os.environ["INSTAGRAM_SESSION_USERNAME"]:
                  raise RuntimeError("Session account was not verified")
              print("SESSION_ACCOUNT_VERIFIED", username)
              profile = instaloader.Profile.from_username(loader.context, "tinygiggleai07")
              count = 0
              for post in profile.get_posts():
                  if post.is_video:
                      print("AUTHENTICATED_REEL_DISCOVERED", post.shortcode)
                      count += 1
                  if count >= 3:
                      break
              if not count:
                  raise RuntimeError("No video posts returned")
              print("AUTHENTICATED_DISCOVERY_PASSED", count)
          except Exception as exc:
              raise SystemExit("AUTHENTICATED_DISCOVERY_FAILED: " + type(exc).__name__ + ". Session may be rejected or profile access restricted.")
          PY
      - name: Test production collection without publishing
        env:
          INSTAGRAM_REEL_URLS: ${{ vars.INSTAGRAM_REEL_URLS }}
        run: timeout 240s python -u instagram_daily_queue.py collect
      - name: Preserve validated queue for inspection
        uses: actions/upload-artifact@v4
        with:
          name: instagram-daily-queue
          path: reel_queue/
          retention-days: 3
          if-no-files-found: error
      - name: Remove temporary Instagram session
        if: always()
        run: rm -f "$INSTAGRAM_SESSION_FILE"
