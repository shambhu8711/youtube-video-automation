name: Publish next Instagram Reel now
# Recovery requested: publish the next unused Reel after schedule repair.
on:
  push:
    paths: ['.github/workflows/instagram-publish-now.yml']
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  publish:
    uses: ./.github/workflows/instagram-queue.yml
    with:
      mode: publish
    secrets: inherit
