name: Instagram Reels Intake (Private Staging)
on:
  workflow_dispatch:
  schedule:
    - cron: '11 * * * *'
permissions:
  contents: write
concurrency:
  group: instagram-reels-intake
  cancel-in-progress: false
jobs:
  intake:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install yt-dlp google-api-python-client==2.179.0 google-auth==2.40.3
      - name: Run dependency-free local smoke test
        run: python instagram_reels_to_youtube.py --self-test
      - name: Retrieve Reel and stage private YouTube upload
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: python instagram_reels_to_youtube.py
      - name: Persist accepted upload even if earlier step fails
        if: always()
        run: |
          if [ -f instagram_upload_record.json ]; then
            mkdir -p state/instagram_uploads
            python -c 'import json,shutil; d=json.load(open("instagram_upload_record.json")); shutil.copyfile("instagram_upload_record.json","state/instagram_uploads/"+d["instagram_reel_id"]+".json")'
            git config user.name "youtube-automation[bot]"
            git config user.email "youtube-automation[bot]@users.noreply.github.com"
            git add state/instagram_uploads/
            if ! git diff --cached --quiet; then
              git commit -m "Record Instagram Reel intake [skip ci]"
              git pull --rebase origin main
              git push origin HEAD:main
            fi
          fi
